services:
  postgres:
    image: postgres:16-alpine
    container_name: autoboost-core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoboost-core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - autoboost_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoboost-core"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autoboost_pg_data:
